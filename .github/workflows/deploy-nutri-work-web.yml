# Builds Flutter web and publishes to GitHub Pages.
# Live URL: https://kylefarrugia2.github.io/Minithesis/
name: Deploy Nutri Work (web)

on:
  push:
    branches: [main]
    paths:
      - 'nutri_work_app/**'
      - '.github/workflows/deploy-nutri-work-web.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nutri_work_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web (GitHub Pages base path)
        run: |
          flutter build web --release --base-href "/Minithesis/" \
            --dart-define=SUPPORT_EMAIL=kyle.farrugia.j94928@mcast.edu.mt \
            --dart-define=PUBLIC_WEB_URL=https://kylefarrugia2.github.io/Minithesis/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: nutri_work_app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
